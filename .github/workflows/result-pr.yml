name: result-pr

on:
  pull_request:
    paths:
      - "results/**"
      - "registry/**"
      - "schemas/**"

permissions:
  contents: read

jobs:
  validate-public-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out untrusted contribution without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Enforce append-only public artifacts
        run: node bin/agent-app-benchmark.mjs publication validate-append-only --base "${{ github.event.pull_request.base.sha }}"
      - run: npm run validate
      - name: Recompute every result this pull request adds
        shell: bash
        run: |
          while IFS= read -r -d '' result; do
            node bin/agent-app-benchmark.mjs result validate --input "$result"
          done < <(git diff -z --name-only --diff-filter=A "${{ github.event.pull_request.base.sha }}...HEAD" -- 'results/**/result.json')
